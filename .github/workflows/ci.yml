name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21

      # This also caches ~/.gradle, and it only writes back what the build
      # actually used, so a separate actions/cache step would just shadow it
      # with a coarser copy.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Run lint and tests
        run: ./gradlew lint test

  debug_apk:
    name: Debug APK
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload_debug_apk.outputs.artifact-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      # A runner has no ~/.android, so AGP would generate a throwaway debug key on
      # every run. Android refuses to update an app whose signing certificate
      # changed, which surfaces as a bare "App not installed" on the phone.
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the debug APK gets a random signing key and will not install over an existing build"
            exit 0
          fi
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: Assemble debug APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew --configuration-cache assembleDebug

      - name: Verify the debug APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      # `archive: false` uploads the APK as-is instead of wrapping it in a zip,
      # but it takes the artifact name from the file name, hence the rename.
      - name: Name the debug APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/hreader-debug.apk

      - name: Upload debug APK
        id: upload_debug_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/hreader-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Create debug APK checksum
        run: sha256sum artifacts/hreader-debug.apk > artifacts/hreader-debug.apk.sha256

      - name: Upload debug APK checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hreader-debug-apk-sha256
          path: artifacts/hreader-debug.apk.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

  update_debug_apk_comment:
    name: Update debug APK PR comment
    needs: debug_apk
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: debug-apk-comment-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Update PR comment with debug APK
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ARTIFACT_URL: ${{ needs.debug_apk.outputs.artifact_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- hreader-debug-apk -->';
            const body = [
              marker,
              '### Debug APK',
              '',
              `[Download the latest debug APK](${process.env.ARTIFACT_URL})`,
              '',
              `Built by [CI run](${process.env.RUN_URL}).`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existingComment = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  release:
    needs: [build, debug_apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21

      # This also caches ~/.gradle, and it only writes back what the build
      # actually used, so a separate actions/cache step would just shadow it
      # with a coarser copy.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Assemble signed release APK and App Bundle
        env:
          RELEASE_KEYSTORE_PATH: keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: ./gradlew --no-build-cache assembleRelease bundleRelease

      - name: Verify the release APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Verify the App Bundle is signed
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Name the release artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/hreader-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/hreader-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/hreader-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload release App Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/hreader-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Create release APK checksum
        run: sha256sum artifacts/hreader-release.apk > artifacts/hreader-release.apk.sha256

      - name: Upload release APK checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hreader-release-apk-sha256
          path: artifacts/hreader-release.apk.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Create release App Bundle checksum
        run: sha256sum artifacts/hreader-release.aab > artifacts/hreader-release.aab.sha256

      - name: Upload release App Bundle checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hreader-release-aab-sha256
          path: artifacts/hreader-release.aab.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f keystore/release.jks
