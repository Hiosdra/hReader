name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      # This also caches ~/.gradle, and it only writes back what the build
      # actually used, so a separate actions/cache step would just shadow it
      # with a coarser copy.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run lint and tests
        run: ./gradlew --configuration-cache lint test

  debug_apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # A runner has no ~/.android, so AGP would generate a throwaway debug key on
      # every run. Android refuses to update an app whose signing certificate
      # changed, which surfaces as a bare "App not installed" on the phone.
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the debug APK gets a random signing key and will not install over an existing build"
            exit 0
          fi
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew --configuration-cache assembleDebug

      - name: Verify the debug APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      # `archive: false` uploads the APK as-is instead of wrapping it in a zip,
      # but it takes the artifact name from the file name, hence the rename.
      - name: Name the debug APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/hreader-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hreader-debug.apk
          archive: false
          if-no-files-found: error

  release:
    needs: [build, debug_apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      # This also caches ~/.gradle, and it only writes back what the build
      # actually used, so a separate actions/cache step would just shadow it
      # with a coarser copy.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Assemble signed release APK
        env:
          RELEASE_KEYSTORE_PATH: keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-build-cache assembleRelease

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Name the release APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/hreader-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hreader-release.apk
          archive: false
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f keystore/release.jks
